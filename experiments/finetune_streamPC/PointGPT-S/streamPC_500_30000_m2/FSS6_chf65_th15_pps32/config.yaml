optimizer: { type: AdamW, kwargs: { lr: 0.0001, weight_decay: 0.05 } }

scheduler: { type: CosLR, kwargs: { epochs: 300, initial_epochs: 30 } }

dataset:
  {
    train:
      {
        _base_: cfgs/dataset_configs/streamPC.yaml,
        others: { subset: "train" },
      },
    val:
      {
        _base_: cfgs/dataset_configs/streamPC.yaml,
        others: { subset: "val" },
      },
    test:
      {
        _base_: cfgs/dataset_configs/streamPC.yaml,
        others: { subset: "test" },
      },
  }
model:
  {
    NAME: PointTransformer,
    trans_dim: 384,
    depth: 12,
    drop_path_rate: 0.1,
    cls_dim: 71,
    num_heads: 6,
    group_size: 32,
    num_group: 64,
    encoder_dims: 384,
    decoder_depth: 4,
    cls_method: m1,  # for default set to 'm0'
  }

npoints: 1024
total_bs: 1
step_per_update: 1
max_epoch: 300
grad_norm_clip: 10
