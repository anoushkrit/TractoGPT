optimizer: { type: AdamW, kwargs: { lr: 0.0001, weight_decay: 0.05 } }

scheduler: { type: CosLR, kwargs: { epochs: 300, initial_epochs: 30 } }

dataset:
  {
    train:
      {
        _base_: cfgs/dataset_configs/s3FSSknnTrInF.yaml,
        others: { subset: "trainset" },
      },
    val:
      {
        _base_: cfgs/dataset_configs/s3FSSknnTrInF.yaml,
        others: { subset: "validset" },
      },
    test:
      {
        _base_: cfgs/dataset_configs/s3FSSknnTrInF.yaml,
        others: { subset: "testset" },
      },
  }
model:
  {
    NAME: PointTransformer,
    trans_dim: 256,
    depth: 9,
    drop_path_rate: 0.1,
    cls_dim: 32,
    num_heads: 4,
    group_size: 8,
    num_group: 64,
    encoder_dims: 256,
    decoder_depth: 4,
    cls_method: m0,  # for default set to 'm0'
    triplet_loss: False,
  }

npoints: 1024
total_bs: 1
step_per_update: 1
max_epoch: 300
grad_norm_clip: 10
